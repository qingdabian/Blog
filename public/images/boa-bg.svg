<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17131d"/>
      <stop offset="1" stop-color="#241b30"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d2c6b"/>
      <stop offset="1" stop-color="#5b1a40"/>
    </linearGradient>
  </defs>

  <!-- 女帝剪影：背影 + 长直黑发 + 紫红旗袍，右侧偏置大图 -->
  <g>
    <!-- 头 -->
    <ellipse cx="840" cy="208" rx="46" ry="56" fill="url(#hair)"/>
    <!-- 长发：大块垂到腰下，带波浪尾 -->
    <path fill="url(#hair)" d="M 794 200
      C 726 208 700 300 706 430
      C 712 540 690 610 660 668
      C 700 690 760 676 790 646
      C 816 618 826 574 824 520
      C 840 570 858 600 892 596
      C 918 592 928 560 920 520
      C 930 480 934 430 920 360
      C 908 296 880 214 894 190
      C 866 184 830 192 794 200 Z"/>
    <!-- 颈与肩 -->
    <path fill="#17131d" d="M 812 258 C 806 268 790 280 778 290 L 900 290 C 890 278 872 266 864 258 Z"/>
    <!-- 身体 + 旗袍裙摆（开叉长裙） -->
    <path fill="url(#dress)" d="M 778 286
      C 760 330 742 400 734 480
      C 728 540 700 610 656 664
      C 682 690 700 706 690 742
      C 708 728 740 706 766 676
      C 790 648 800 612 798 572
      C 816 622 846 656 880 646
      C 916 636 934 606 920 566
      C 938 590 962 610 984 596
      C 1002 584 1002 552 986 532
      C 972 516 952 512 938 512
      C 930 440 914 360 900 286 Z"/>
    <!-- 蛇形耳环（女帝标志） -->
    <path d="M 790 240 C 780 250 782 268 796 272 C 808 276 814 264 806 254" fill="none" stroke="#9d2c6b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="790" cy="288" r="10" fill="#9d2c6b"/>
    <!-- 腿（旗袍开叉露出） -->
    <path d="M 826 620 C 836 660 842 700 848 742 C 840 726 816 692 806 656 Z" fill="#17131d"/>
    <path d="M 806 656 C 814 690 822 716 834 740 C 826 714 814 678 806 656 Z" fill="#17131d" opacity="0.55"/>
    <!-- 盘蛇装饰线（脚边） -->
    <path d="M 700 830 C 760 850 840 820 900 838 C 940 848 920 870 880 864 C 820 852 720 868 700 830 Z" fill="none" stroke="#9d2c6b" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 飘落樱花点 -->
  <g fill="#9d2c6b" opacity="0.35">
    <circle cx="620" cy="120" r="5"/>
    <circle cx="560" cy="230" r="4"/>
    <circle cx="500" cy="160" r="6"/>
    <circle cx="1080" cy="330" r="5"/>
    <circle cx="1120" cy="520" r="4"/>
    <circle cx="460" cy="420" r="5"/>
    <circle cx="540" cy="560" r="4"/>
    <circle cx="1140" cy="700" r="5"/>
  </g>
</svg>
